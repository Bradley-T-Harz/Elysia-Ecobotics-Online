<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elysia Ecobotics Online — Temporarily Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #08120f;
        color: #eef8f1;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(70, 190, 135, 0.18), transparent 34rem),
          radial-gradient(circle at 80% 80%, rgba(88, 160, 255, 0.14), transparent 32rem),
          linear-gradient(135deg, #06100d, #101827 70%, #07130f);
      }

      main {
        width: min(680px, calc(100vw - 2rem));
        padding: 2.5rem;
        border: 1px solid rgba(190, 255, 220, 0.18);
        border-radius: 28px;
        background: rgba(8, 18, 15, 0.78);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(18px);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: #9ee6bd;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.78rem;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.75rem);
        line-height: 1;
      }

      p {
        color: #c9d8cf;
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .note {
        margin-top: 1.5rem;
        padding: 1rem;
        border-radius: 18px;
        background: rgba(158, 230, 189, 0.08);
        border: 1px solid rgba(158, 230, 189, 0.16);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Elysia Ecobotics Online</p>
      <h1>Temporarily offline</h1>
      <p>
        The public site is temporarily offline while we prepare, verify, and protect the launch
        materials for Elysia Ecobotics Online.
      </p>
      <p class="note">
        The private local Elysia system is separate from this public website and remains local-first.
      </p>
    </main>
  </body>
</html>
